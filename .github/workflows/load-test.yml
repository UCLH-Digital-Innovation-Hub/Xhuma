name: Serverless Benchmarking

on:
  push:
    branches:
      - int
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent Locust users'
        required: true
        default: '5'
      spawn_rate:
        description: 'Users to spawn per second'
        required: true
        default: '2'
      duration:
        description: 'Duration of the test (e.g., 3m, 5m)'
        required: true
        default: '3m'
      environment:
        description: 'Environment to test (e.g. int, main)'
        required: true
        default: 'int'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uclh-digital-innovation-hub/xhuma
  RESOURCE_GROUP: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
  APP_NAME: ${{ github.event.inputs.environment == 'main' && 'xhuma-app-prd' || 'xhuma-app-int' }}

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Run Serverless ACI Benchmark
        run: |
          USERS="${{ github.event.inputs.users || '50' }}"
          SPAWN_RATE="${{ github.event.inputs.spawn_rate || '10' }}"
          DURATION="${{ github.event.inputs.duration || '3m' }}"
          ENV_TARGET="${{ github.event.inputs.environment || 'int' }}"

          echo "Triggering Serverless ACI Benchmark ($USERS users, $DURATION)..."

          # Fetch infrastructure details
          VNET_NAME="${APP_NAME}-vnet"
          SUBNET_ID=$(az network vnet subnet show -g $RESOURCE_GROUP -n locust-subnet --vnet-name $VNET_NAME --query id -o tsv)
          MI_RESOURCE_ID=$(az identity show -g $RESOURCE_GROUP -n "${APP_NAME}-locust-mi" --query id -o tsv)
          MI_CLIENT_ID=$(az identity show -g $RESOURCE_GROUP -n "${APP_NAME}-locust-mi" --query clientId -o tsv)
          KV_URL="https://${APP_NAME}-kv.vault.azure.net/"

          # Encode the locustfile to pass securely to the container
          SCRIPT_B64=$(cat tests/load_tests/locustfile.py | base64 -w 0)

          # We target the internal App Service FQDN
          TARGET_URL="https://${APP_NAME}.azurewebsites.net"

          # Create and execute the ephemeral container using a standard python image
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name "xhuma-benchmark" \
            --image "python:3.13-slim" \
            --vnet $VNET_NAME \
            --subnet $SUBNET_ID \
            --assign-identity $MI_RESOURCE_ID \
            --restart-policy Never \
            --os-type Linux \
            --cpu 1 \
            --memory 2 \
            --environment-variables KEY_VAULT_URL=$KV_URL PEM_SECRET_NAME="epic-ca-cert" AZURE_CLIENT_ID=$MI_CLIENT_ID LOCUSTFILE_B64=$SCRIPT_B64 \
            --command-line "/bin/sh -c 'echo \$LOCUSTFILE_B64 | base64 -d > locustfile.py && pip install locust azure-identity azure-keyvault-secrets && locust -f locustfile.py --headless -u $USERS -r $SPAWN_RATE -t $DURATION --host $TARGET_URL --html report.html && echo \"==== REPORT_START ====\" && cat report.html | base64 -w 0 && echo \"==== REPORT_END ====\"'"

          # Wait for completion and dump logs, saving output to extract the HTML report
          az container attach --resource-group $RESOURCE_GROUP --name "xhuma-benchmark" | tee benchmark.log

          # Extract the base64 report and decode it
          echo "Extracting HTML report..."
          sed -n '/==== REPORT_START ====/,/==== REPORT_END ====/p' benchmark.log | grep -v '====' > report_b64.txt
          if [ -s report_b64.txt ]; then
            base64 -d report_b64.txt > benchmark_report.html
            echo "Successfully generated benchmark_report.html!"
          else
            echo "Failed to extract report from logs."
          fi

      - name: Upload Benchmark Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.event.inputs.environment || 'int' }}
          path: benchmark_report.html

      - name: Cleanup Serverless ACI
        if: always()
        run: |
          echo "Tearing down benchmark container..."
          az container delete --resource-group ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }} --name "xhuma-benchmark" --yes
