name: Serverless Benchmarking

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent Locust users'
        required: true
        default: '50'
      spawn_rate:
        description: 'Users to spawn per second'
        required: true
        default: '10'
      duration:
        description: 'Duration of the test (e.g., 3m, 5m)'
        required: true
        default: '3m'
      environment:
        description: 'Environment to test (e.g. int, main)'
        required: true
        default: 'int'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uclh-digital-innovation-hub/xhuma
  RESOURCE_GROUP: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
  APP_NAME: ${{ github.event.inputs.environment == 'main' && 'xhuma-app-prd' || 'xhuma-app-int' }}

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Run Serverless ACI Benchmark
        run: |
          USERS=${{ github.event.inputs.users }}
          SPAWN_RATE=${{ github.event.inputs.spawn_rate }}
          DURATION=${{ github.event.inputs.duration }}

          echo "Triggering Serverless ACI Benchmark ($USERS users, $DURATION)..."

          # Fetch infrastructure details
          VNET_NAME="${APP_NAME}-vnet"
          SUBNET_ID=$(az network vnet subnet show -g $RESOURCE_GROUP -n locust-subnet --vnet-name $VNET_NAME --query id -o tsv)
          MI_ID=$(az identity show -g $RESOURCE_GROUP -n "${APP_NAME}-locust-mi" --query id -o tsv)
          KV_URL="https://${APP_NAME}-kv.vault.azure.net/"

          # Encode the locustfile to pass securely to the container
          SCRIPT_B64=$(cat tests/load_tests/locustfile.py | base64 -w 0)

          # We target the internal App Service FQDN
          TARGET_URL="https://${APP_NAME}.azurewebsites.net"

          # Create and execute the ephemeral container using a standard python image
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name "xhuma-benchmark" \
            --image "python:3.13-slim" \
            --vnet $VNET_NAME \
            --subnet $SUBNET_ID \
            --assign-identity $MI_ID \
            --restart-policy Never \
            --os-type Linux \
            --cpu 1 \
            --memory 2 \
            --environment-variables KEY_VAULT_URL=$KV_URL PEM_SECRET_NAME="epic-ca-cert" AZURE_CLIENT_ID=$MI_ID LOCUSTFILE_B64=$SCRIPT_B64 \
            --command-line "/bin/sh -c 'echo \$LOCUSTFILE_B64 | base64 -d > locustfile.py && pip install locust azure-identity azure-keyvault-secrets && locust -f locustfile.py --headless -u $USERS -r $SPAWN_RATE -t $DURATION --host $TARGET_URL'"

          # Wait for completion and dump logs
          az container attach --resource-group $RESOURCE_GROUP --name "xhuma-benchmark"

          echo "Benchmark complete. Tearing down container."
          az container delete --resource-group $RESOURCE_GROUP --name "xhuma-benchmark" --yes
