name: Serverless Benchmarking

on:
  push:
    branches:
      - int
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent Locust users'
        required: true
        default: '50'
      spawn_rate:
        description: 'Users to spawn per second'
        required: true
        default: '10'
      duration:
        description: 'Duration of the test (e.g., 3m, 5m)'
        required: true
        default: '3m'
      environment:
        description: 'Environment to test (e.g. int, main)'
        required: true
        default: 'int'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uclh-digital-innovation-hub/xhuma
  RESOURCE_GROUP: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
  APP_NAME: ${{ github.event.inputs.environment == 'main' && 'app-xhuma-uclh-prd' || 'app-xhuma-int' }}

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment == 'main' && 'rg-xhuma-uclh-prd' || 'rg-xhuma-int' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Serverless ACI Benchmark
        run: |
          USERS="${{ github.event.inputs.users || '50' }}"
          SPAWN_RATE="${{ github.event.inputs.spawn_rate || '10' }}"
          DURATION="${{ github.event.inputs.duration || '3m' }}"
          ENV_TARGET="${{ github.event.inputs.environment || 'int' }}"

          echo "Triggering Serverless ACI Benchmark ($USERS users, $DURATION)..."

          # Fetch infrastructure details
          VNET_NAME="${APP_NAME}-vnet"
          SUBNET_ID=$(az network vnet subnet show -g $RESOURCE_GROUP -n locust-subnet --vnet-name $VNET_NAME --query id -o tsv)
          MI_ID=$(az identity show -g $RESOURCE_GROUP -n "${APP_NAME}-locust-mi" --query id -o tsv)
          KV_URL="https://${APP_NAME}-kv.vault.azure.net/"

          # We use the existing GHCR image
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"

          # We target the internal App Service FQDN
          TARGET_URL="https://${APP_NAME}.azurewebsites.net"

          # Create and execute the ephemeral container
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name "xhuma-benchmark" \
            --image $IMAGE \
            --vnet $VNET_NAME \
            --subnet $SUBNET_ID \
            --assign-identity $MI_ID \
            --restart-policy Never \
            --command-line "uv run locust -f tests/load_tests/locustfile.py --headless -u $USERS -r $SPAWN_RATE -t $DURATION --host $TARGET_URL" \
            --environment-variables KEY_VAULT_URL=$KV_URL PEM_SECRET_NAME="epic-ca-cert" AZURE_CLIENT_ID=$MI_ID

          # Wait for completion and dump logs
          az container attach --resource-group $RESOURCE_GROUP --name "xhuma-benchmark"

          echo "Benchmark complete. Tearing down container."
          az container delete --resource-group $RESOURCE_GROUP --name "xhuma-benchmark" --yes
