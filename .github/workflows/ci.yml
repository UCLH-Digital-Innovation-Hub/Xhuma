name: CI

on:
  push:
    branches: [dev, int, main]
  pull_request:
    branches: [dev, int, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Run Ruff format check
        run: uv run --locked ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests with coverage
        id: tests
        run: |
          uv run coverage run -m pytest --ignore=app/tests/test_api_fuzzing.py --ignore=app/tests/test_fuzzing.py || exit_code=$?
          if [ -z "$exit_code" ]; then exit_code=0; fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          uv run coverage xml
        continue-on-error: true

      # Report the same unit-test suite on every push and pull request.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          format: cobertura
          file: coverage.xml

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != 0
        run: exit 1

  dependabot-container:
    name: Dependabot container journey
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test driver dependencies
        run: uv sync --locked --dev

      - name: Build production image and run ITI-55 → ITI-38 → ITI-39
        run: bash scripts/container_smoke/run.sh

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-container-diagnostics
          path: container-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'int'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --dev

      # Keep fuzzing as a separate pass/fail gate, outside unit-test coverage.
      - name: Run fuzzing tests
        run: uv run --locked pytest app/tests/test_api_fuzzing.py app/tests/test_fuzzing.py

  security:
    name: Security scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
