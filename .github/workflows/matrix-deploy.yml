name: Matrix Deployment Pilot

on:
  push:
    branches:
      - feat/matrix-deployment-pilot

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uclh-digital-innovation-hub/xhuma
  
concurrency:
  group: xhuma-play-release
  cancel-in-progress: false

jobs:
  ci:
    name: CI & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5 # pinned major version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Run Tests
        run: uv run coverage run -m pytest

  build:
    name: Build & Push
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  prepare-targets:
    name: Prepare Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate Targets
        run: python scripts/deploy/validate_targets.py infra/targets.schema.json infra/targets.json
      - name: Select Targets
        id: set-matrix
        run: |
          TARGETS=$(python scripts/deploy/select_targets.py infra/targets.json "${{ github.ref_name }}")
          if [ "$TARGETS" == "[]" ]; then
            echo "No enabled targets found for this branch."
            exit 1
          fi
          echo "matrix={\"target\":$TARGETS}" >> $GITHUB_OUTPUT

  infra-plan:
    name: Infra Plan - ${{ matrix.target.id }}
    needs: [build, prepare-targets]
    runs-on: ${{ matrix.target.runner_label }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      
      - name: Bootstrap State Storage
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: bash infra/bootstrap/setup-play.sh
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="${{ matrix.target.backend_file }}"
            
      - name: Terraform Plan
        id: plan
        working-directory: ./infra
        env:
          TF_VAR_resource_group_name: "${{ matrix.target.resource_group }}"
          TF_VAR_registry_id: "${{ secrets.REGISTRY_ID }}"
          TF_VAR_docker_registry_password: "${{ secrets.CR_PAT }}"
          TF_VAR_docker_registry_username: "${{ github.actor }}"
          TF_VAR_postgres_admin_password: "${{ secrets.POSTGRES_PASSWORD }}"
          TF_VAR_shared_resource_group_name: "${{ secrets.SHARED_RESOURCE_GROUP_NAME }}"
          TF_VAR_shared_key_vault_name: "${{ secrets.SHARED_KEY_VAULT_NAME }}"
        run: |
          terraform plan -input=false -var-file="../${{ matrix.target.tfvars_file }}" -out="${{ matrix.target.id }}.tfplan" > plan_output.txt
          
      - name: Upload Plan to Azure Blob Storage
        working-directory: ./infra
        run: |
          ACCOUNT_KEY=$(az storage account keys list --resource-group "${{ matrix.target.resource_group }}" --account-name "xtfrgxhumaplay" --query '[0].value' -o tsv)
          az storage blob upload \
            --account-name "xtfrgxhumaplay" \
            --account-key "$ACCOUNT_KEY" \
            --container-name tfplans \
            --name "${{ matrix.target.id }}-${{ github.run_id }}.tfplan" \
            --file "${{ matrix.target.id }}.tfplan" \
            --overwrite
            
          PLAN_HASH=$(sha256sum "${{ matrix.target.id }}.tfplan" | awk '{ print $1 }')
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Plan Hash:** \`$PLAN_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ matrix.target.id }}" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 50 plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  infra-apply:
    name: Infra Apply - ${{ matrix.target.id }}
    needs: [prepare-targets, infra-plan]
    runs-on: ${{ matrix.target.runner_label }}
    environment: ${{ matrix.target.github_infra_environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      
      - name: Download Plan from Azure Blob Storage
        working-directory: ./infra
        run: |
          ACCOUNT_KEY=$(az storage account keys list --resource-group "${{ matrix.target.resource_group }}" --account-name "xtfrgxhumaplay" --query '[0].value' -o tsv)
          az storage blob download \
            --account-name "xtfrgxhumaplay" \
            --account-key "$ACCOUNT_KEY" \
            --container-name tfplans \
            --name "${{ matrix.target.id }}-${{ github.run_id }}.tfplan" \
            --file "${{ matrix.target.id }}.tfplan"
            
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="${{ matrix.target.backend_file }}"
            
      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -input=false -auto-approve "${{ matrix.target.id }}.tfplan"

  deploy:
    name: Deploy - ${{ matrix.target.id }}
    needs: [build, prepare-targets, infra-apply]
    runs-on: ${{ matrix.target.runner_label }}
    environment: ${{ matrix.target.github_environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-targets.outputs.matrix) }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          
      - name: Capture Previous Digest
        id: prev_digest
        run: |
          PREV_DIGEST=$(az webapp config container show --name "${{ matrix.target.app_service_name }}" --resource-group "${{ matrix.target.resource_group }}" --query 'value[?name==`DOCKER_CUSTOM_IMAGE_NAME`].value' -o tsv || echo "none")
          echo "PREV_DIGEST=$PREV_DIGEST" >> $GITHUB_ENV
          
      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ matrix.target.app_service_name }}
          images: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}'
          
      - name: Verify New Digest
        run: |
          NEW_DIGEST=$(az webapp config container show --name "${{ matrix.target.app_service_name }}" --resource-group "${{ matrix.target.resource_group }}" --query 'value[?name==`DOCKER_CUSTOM_IMAGE_NAME`].value' -o tsv || echo "none")
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Image:** \`$PREV_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "**New Image:** \`$NEW_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ matrix.target.id }}" >> $GITHUB_STEP_SUMMARY
