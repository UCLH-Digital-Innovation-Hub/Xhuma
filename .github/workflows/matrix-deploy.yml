# CI, build/scan and target selection run concurrently; rollout requires all three.
name: Matrix Deployment
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uclh-digital-innovation-hub/xhuma
concurrency:
  group: xhuma-matrix-${{ github.ref_name }}
  cancel-in-progress: false
'on':
  workflow_dispatch:
  push:
    branches:
    - dev
    - int
    - main
permissions:
  contents: read
jobs:
  ci:
    name: CI & Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: uv sync --locked --dev
    - name: Ruff Check
      run: uv run --locked ruff check .
    - name: Ruff Format Check
      run: uv run --locked ruff format --check .
    - name: Run Tests
      run: uv run coverage run -m pytest
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: type=sha,format=long
    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
  prepare-targets:
    name: Prepare Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install jsonschema
      run: pip install jsonschema
    - name: Validate Targets
      run: python scripts/deploy/validate_targets.py infra/targets.schema.json infra/targets.json
    - name: Select Targets
      id: set-matrix
      run: |
        TARGETS=$(python scripts/deploy/select_targets.py infra/targets.json "${{ github.ref_name }}")
        if [ "$TARGETS" == "[]" ]; then
          echo "No enabled targets found for this branch."
          exit 1
        fi
        echo "matrix={\"target\":$TARGETS}" >> $GITHUB_OUTPUT
  rollout:
    name: Rollout - ${{ matrix.target.id }}
    needs:
    - ci
    - build
    - prepare-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-targets.outputs.matrix) }}
    uses: ./.github/workflows/deploy-target.yml
    with:
      target: ${{ toJSON(matrix.target) }}
      digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
