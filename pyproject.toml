[project]
name = "Xhuma"
version = "0.9"
requires-python = "~=3.13"
dependencies = [
    "fastapi",
    "pyjwt",
    "httpx",
    "xmltodict",
    "uvicorn[standard]",
    "fhirclient~=3.0.0",
    "redis",
    "cryptography",
    "jwcrypto",
    "celery",
    "pydantic",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
    "asyncpg",
    "sqlalchemy",
    "grpcio",
    "python-multipart",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "azure-monitor-opentelemetry>=1.8.7",
]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black",
    "websockets",
    "isort",
    "pytest",
    "xmlschema",
    "pytest-asyncio",
    "pytest-benchmark",
    "flake8",
    "pre-commit",
    "coverage",
    "ruff>=0.15.12",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.python.org/simple"
