[project]
name = "Xhuma"
version = "0.9.2"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pyjwt>=2.15.1",
    "httpx",
    "xmltodict",
    "uvicorn[standard]",
    "fhirclient~=4.4.0",
    "redis",
    "cryptography>=50.0.2",
    "jwcrypto",
    "pydantic",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-redis",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "grpcio",
    "python-multipart>=0.0.31",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "azure-monitor-opentelemetry>=1.8.7",
    "azure-identity",
    "azure-keyvault-secrets",
    "urllib3>=2.8.0",
    "defusedxml>=0.7.1",
    "tzdata>=2026.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
extend-select = ["I"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[dependency-groups]
dev = [
    "websockets",
    "pytest",
    "xmlschema",
    "pytest-asyncio",
    "pytest-benchmark",
    "pre-commit",
    "coverage",
    "ruff>=0.17.0",
    "locust",
    "pytest-cov>=7.1.0",
    "schemathesis>=4.31.0",
    "hypothesis>=6.169.0",
    "pytest-sugar>=1.1.1",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.python.org/simple"

[tool.creosote]
paths=[
    "app",
    "alembic"]
deps-file="pyproject.toml"
sections=["project.dependencies"]
