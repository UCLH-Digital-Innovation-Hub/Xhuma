repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '\.[mM][dD]$'
      - id: trailing-whitespace
        exclude: '\.[mM][dD]$'

  # Use uv.lock and pyproject.toml, just like CI, and check the whole repository.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format .
        language: system
        pass_filenames: false
        always_run: true
